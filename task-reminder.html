<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task reminder</title>
<style>
  html, body { margin: 0; background: transparent; }
  body { display: grid; place-items: center; min-height: 100vh; overflow: hidden; }
  #title {
    margin: 0 5%;
    color: white;
    font: 850 clamp(28px, 7vw, 80px)/1.08 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-align: center;
    text-wrap: balance;
    overflow-wrap: anywhere;
    text-shadow: 0 2px 8px #10131b, 0 0 2px #10131b;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
    overflow: hidden;
    opacity: 0;
  }
</style>
<p id="title"></p>
<script>
  const title = document.getElementById('title');
  let animation;

  window.showReminder = text => {
    animation?.cancel();
    title.textContent = text;
    animation = title.animate([
      {opacity: 0, offset: 0, easing: 'ease-out'},
      {opacity: 0.78, offset: 0.25},
      {opacity: 0.78, offset: 0.75, easing: 'ease-in'},
      {opacity: 0, offset: 1}
    ], {duration: 2000});
    animation.onfinish = () => window.__TAURI__.core.invoke('hide_task_reminder');
  };
</script>
</html>
