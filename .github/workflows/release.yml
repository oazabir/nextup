name: Desktop releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
            bundles: nsis
          - platform: macos-universal
            runner: macos-15
            bundles: app,dmg
            target: universal-apple-darwin
          - platform: linux-x64
            runner: ubuntu-22.04
            bundles: appimage
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify release version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME must match app version v$version"
            exit 1
          fi
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libfuse2
      - name: Build installers
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
          TARGET: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
        run: |
          rustup update stable
          rustup default stable
          config=()
          if [[ -n "$TARGET" ]]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
            config+=(--target "$TARGET")
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            : "${TAURI_SIGNING_PRIVATE_KEY:?Missing GitHub Actions signing secret}"
            echo '{"bundle":{"createUpdaterArtifacts":true}}' > updater-build.json
            config+=(--config "$(pwd)/updater-build.json")
          fi
          npx --yes --package @tauri-apps/cli@2.12.6 -- tauri build "${config[@]}" --bundles "$BUNDLES" -- --locked
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$RUNNER_OS" == "macOS" ]]; then
            dmg=(src-tauri/target/"$TARGET"/release/bundle/dmg/*.dmg)
            npx --yes --package @tauri-apps/cli@2.12.6 -- tauri signer sign --app-version "${GITHUB_REF_NAME#v}" "${dmg[0]}"
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: next-up-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg.sig
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: next-up-*
          path: installers
      - name: Prepare release files
        run: python3 .github/scripts/release_manifest.py installers release "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          updater_tag="updater-$GITHUB_REF_NAME"
          if gh release view "$updater_tag" >/dev/null 2>&1; then
            gh release upload "$updater_tag" --clobber release/updater/*
          else
            gh release create "$updater_tag" --target "$(git rev-parse HEAD)" --prerelease --latest=false \
              --title "Next Up $GITHUB_REF_NAME macOS updater" release/updater/*
          fi
          if [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)" == true ]]; then
            gh release upload "$GITHUB_REF_NAME" --clobber release/downloads/*
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --draft release/downloads/*
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
