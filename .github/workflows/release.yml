name: Desktop releases

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
            bundles: nsis
            extension: exe
          - platform: macos-apple-silicon
            runner: macos-15
            bundles: dmg
            extension: dmg
          - platform: macos-intel
            runner: macos-15-intel
            bundles: dmg
            extension: dmg
          - platform: linux-x64
            runner: ubuntu-22.04
            bundles: deb,appimage
            extension: ''
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify release version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME must match app version v$version"
            exit 1
          fi
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libfuse2
      - name: Build installers
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: |
          rustup update stable
          rustup default stable
          npx --yes --package @tauri-apps/cli@2 -- tauri build --bundles "$BUNDLES" -- --locked
      - uses: actions/upload-artifact@v6
        with:
          name: next-up-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/**/*.${{ matrix.extension }}
          if-no-files-found: error
        if: runner.os != 'Linux'
      - uses: actions/upload-artifact@v6
        with:
          name: next-up-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
        if: runner.os == 'Linux'

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: installers
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find installers -type f -print0)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes "${assets[@]}"
